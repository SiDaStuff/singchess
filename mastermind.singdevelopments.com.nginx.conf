# nginx config for mastermind.singdevelopments.com (Node API backend)
#
# TOPOLOGY (CAF central reverse proxy):
#   browser --https--> CAF central proxy  (TLS terminates there, cert lives there)
#           --http---> this VM :8080      (this file, plain HTTP, internal net)
#           --http---> 127.0.0.1:3000     (Node API, PM2 cluster)
#
# This VM does NOT bind 80/443 and does NOT run certbot: Let's Encrypt HTTP-01
# validation terminates at the central proxy, so the certificate lives there.
# Do NOT re-add `listen 80/443` or ssl_* directives here.
#
# Why keep a local nginx at all?
#   1. Sticky routing across the 2-instance PM2 cluster (hash on the
#      sid_device cookie) — required by the Coach SSE/tool-result flow.
#   2. SSE buffering/timeout handling (see the stream locations below).
#
# The frontend SPA is on Netlify (chess.singdevelopments.com).
# Backend is API-only: SERVE_STATIC=0, TRUST_PROXY=1.

upstream chess_api {
    # PM2 cluster mode runs 2 instances by default on port 3000.
    #
    # STICKY ROUTING (required by the AI Coach browser-tool flow):
    # The Coach SSE stream (/api/coach/chat) parks pending browser-tool calls
    # (stockfish, game_review, show_board, ask_question, end_conversation) in
    # per-process memory. The browser later POSTs /api/coach/tool-result to
    # resolve them. Without affinity, round-robin can send the POST to a
    # different instance than the one holding the SSE → not_found → 60s timeout.
    #
    # We hash on the sid_device cookie (set by Node's deviceCookieMiddleware on
    # every request, 1-year, stable per browser) so both /api/coach/chat and
    # /api/coach/tool-result from the same browser land on the same worker.
    # `consistent` minimizes reshuffling if instance count changes.
    hash $cookie_sid_device consistent;

    server 127.0.0.1:3000;
}

# ── Internal listener (CAF proxy → this VM) ───────────────────────────
# Plain HTTP on a non-privileged internal port, reachable from the central
# proxy over the internal network. No TLS, no port 80, no certbot here.
# If a host firewall is active, allow :8080 from the CAF proxy subnets only.
server {
    listen 8080;
    listen [::]:8080;
    server_name mastermind.singdevelopments.com;

    # ── Real client IP ────────────────────────────────────────────────
    # The CAF proxy is the direct peer and appends the real client IP to
    # X-Forwarded-For. Trusting RFC1918 sources lets real_ip resolve
    # $remote_addr back to the actual client; we pass it on as X-Real-IP,
    # which Node prefers for rate-limit bucketing. If CAF publishes their
    # exact proxy subnets, replace these with those specific ranges.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ── Security headers (complement the Express helmet equivalents) ──
    # nginx's add_header inheritance gotcha: a location that defines ANY
    # add_header (e.g. Cache-Control below) inherits NONE of these server-level
    # headers — /vendor/ and the SSE locations were silently shipping without
    # nosniff / HSTS / X-Frame-Options. Every location now includes the shared
    # snippet — deploy it once with:
    #   sudo mkdir -p /etc/nginx/snippets
    #   sudo cp server/data/security-headers.conf /etc/nginx/snippets/
    include /etc/nginx/snippets/security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # NOTE: the previous Cloudflare set_real_ip_from ranges are gone —
    # traffic no longer arrives from Cloudflare directly; it arrives from
    # the CAF internal proxy (covered by the RFC1918 ranges above).

    # ── Root / home → Netlify frontend ────────────────────────────────
    # This backend is API-only (SERVE_STATIC=0). Visiting the bare domain
    # (mastermind.singdevelopments.com) shows nothing useful, so redirect the home page to
    # the Netlify SPA. API, vendor, and health paths are NOT redirected.
    location = / {
        return 301 https://chess.singdevelopments.com/;
    }

    # ── Health check (no auth, no buffering) ──────────────────────────
    location /health {
        proxy_pass http://chess_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # CAF terminates TLS, so the public scheme is always https. Node
        # reads X-Forwarded-Proto to decide whether the sid_device cookie
        # gets the Secure flag — send a constant https, not $scheme (which
        # is plain http on this internal hop).
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    # ── Static vendor files (Stockfish WASM, served from Node) ───────
    # Browser workers load these cross-origin from chess.singdevelopments.com.
    # The Node server (server/index.cjs) sets CORS headers (Access-Control-
    # Allow-Origin + Cross-Origin-Resource-Policy) in its /vendor middleware.
    # Do NOT add them here too — duplicates make browsers reject the response
    # ("multiple values '...'", only one allowed). Nginx just proxies and adds
    # caching + methods headers that Node doesn't set.
    location /vendor/ {
        proxy_pass http://chess_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WASM is small (<5 MB) and immutable; cache aggressively.
        proxy_cache off;
        expires 1y;
        # Re-include security headers: this location's add_header directives
        # cancel server-level inheritance (nginx add_header gotcha).
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    }

    # ── API: SSE streaming endpoints ──────────────────────────────────
    # Coach chat (/api/coach/chat), server review (/api/analyze/stream),
    # anticheat (/api/anticheat/stream), and user stream (/api/users/me/stream)
    # all use SSE and can run 2-10+ minutes. CRITICAL: no buffering.
    # The CAF central proxy needs the same treatment: proxy_buffering off
    # and read timeout >= 600s for these paths (the Node app also sends
    # X-Accel-Buffering: no itself, which honors it per-response).
    #
    # POST /api/coach/chat         — LLM streaming, tool loop, 10 min typical
    # POST /api/coach/tool-result  — browser tool result callback, short
    # POST /api/analyze/stream     — server review, up to 500 plies
    # POST /api/anticheat/stream   — anticheat analysis, multi-game
    # GET  /api/users/me/stream    — presence heartbeat, 15 min max
    #
    # The Node app already sends X-Accel-Buffering: no on stream responses,
    # but setting it here too is defense in depth.
    location /api/coach/chat {
        proxy_pass http://chess_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # SSE — no buffering, long timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;

        # Cloudflare/central proxy: ensure no proxy buffering
        proxy_set_header X-Accel-Buffering no;
        add_header X-Accel-Buffering no;
        # SSE locations define their own add_header -> re-include security headers.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location /api/anticheat/stream {
        proxy_pass http://chess_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
        proxy_set_header X-Accel-Buffering no;
        add_header X-Accel-Buffering no;
        # SSE locations define their own add_header -> re-include security headers.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location /api/analyze/stream {
        proxy_pass http://chess_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
        proxy_set_header X-Accel-Buffering no;
        add_header X-Accel-Buffering no;
        # SSE locations define their own add_header -> re-include security headers.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location /api/users/me/stream {
        proxy_pass http://chess_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;  # 5 min — server caps at 15 min but heartbeats every 20s
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
        proxy_set_header X-Accel-Buffering no;
        add_header X-Accel-Buffering no;
        # SSE locations define their own add_header -> re-include security headers.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ── API: regular (non-streaming) endpoints ─────────────────────────
    # POST /api/analyze       — short analysis request
    # GET  /api/puzzle        — puzzle fetch
    # GET  /api/opening-explorer — opening stats
    # GET  /api/recent-games  — recent games
    # GET  /api/public-stats  — public stats
    # GET  /api/profile/:username — player profile
    # GET  /api/users/me      — auth/profile fetch
    # POST /api/users/me      — profile update
    # POST /api/puzzle/solve  — puzzle solve
    # POST /api/anticheat     — short anticheat submit
    # POST /api/auth/ban-status — ban check
    # POST /api/coach/tool-result — short browser-tool callback
    # POST /api/admin/*       — admin endpoints
    # POST /api/contact       — contact form
    # POST /api/site/visit    — analytics ping
    #
    # These are short requests (sub-second to a few seconds). Standard
    # buffering is fine and slightly more efficient.
    location /api/ {
        # Exclude SSE-stream locations (caught by the more-specific patterns above).
        # This catches everything else under /api/.
        proxy_pass http://chess_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # CORS preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Content-Length 0;
            return 204;
        }
    }

    # ── CORS preflight for /vendor (not caught by /api/ rule above) ───
    location = /vendor/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://chess.singdevelopments.com" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Content-Length 0;
            return 204;
        }
    }

    # ── Request size & body limits ─────────────────────────────────────
    client_max_body_size 2m;
    client_body_buffer_size 128k;

    # ── Logging ────────────────────────────────────────────────────────
    access_log /var/log/nginx/mastermind.singdevelopments.com.access.log;
    error_log  /var/log/nginx/mastermind.singdevelopments.com.error.log warn;

    # ── Rate limiting zone (optional, defense in depth) ────────────────
    # Uncomment and adjust the burst if you want nginx-level throttling.
    # The Node app has its own rate limiter (180 req/min per IP on /api,
    # tighter limits on specific endpoints).
    #
    # limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
    # location /api/ { limit_req zone=api_zone burst=60 nodelay; ... }
}