# Shared nginx security headers — included at server level AND inside every
# location that defines its own add_header directives (Cache-Control,
# X-Accel-Buffering, ...). nginx's add_header inheritance is all-or-nothing:
# a location with ANY add_header of its own inherits NONE from the server
# block, so without these per-location includes those responses silently
# shipped without the headers below.
#
# Deploy: copy next to chess.sidastuff.com.nginx.conf so the relative include
# resolves (or change the include paths to /etc/nginx/snippets/...).

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
